  </g>
  <g fill="#973f1f">
    <path d="M40 336h60v40H40z"/><path d="M140 316h60v40h-60z"/><path d="M240 296h60v40h-60z"/>
    <path d="M340 276h60v40h-60z"/><path d="M440 276h60v40h-60z"/><path d="M540 296h60v40h-60z"/>
    <path d="M640 316h60v40h-60z"/><path d="M740 336h60v40h-60z"/>
  </g>

  <!-- muro -->
  <rect x="0" y="372" width="800" height="228" fill="#f6ead3"/>
  <g stroke="#17130e" stroke-opacity=".18" stroke-width="2">
    <path d="M0 430h800"/><path d="M0 488h800"/><path d="M0 546h800"/>
    <path d="M120 372v58"/><path d="M300 430v58"/><path d="M520 430v58"/>
    <path d="M200 488v58"/><path d="M640 488v58"/><path d="M420 546v54"/>
