      <stop offset="0" stop-color="#efe0c6"/>
      <stop offset="1" stop-color="#e2ccab"/>
    </linearGradient>
    <pattern id="a5w" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20h40M20 0v40" stroke="#17130e" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#a5)"/>
